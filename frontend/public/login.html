<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WearCare Mate · 로그인</title>
  <style>
    /* WearCare Mate - 디자인 토큰 (index.css와 동일하게 유지) */
    :root {
      --color-bg: #e9e9ec;
      --color-surface: #f7f7f8;
      --color-surface-2: #ffffff;
      --color-panel: #ededf0;
      --color-border: #d6d6db;
      --color-border-strong: #1a1a1a;

      --color-ink: #141414;
      --color-ink-soft: #3f3f46;
      --color-muted: #71717a;
      --color-faint: #a1a1aa;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-pill: 999px;

      --shadow-sm: 0 1px 2px rgba(20, 20, 20, 0.06);
      --shadow-md: 0 6px 20px rgba(20, 20, 20, 0.08);

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Malgun Gothic", "맑은 고딕", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
    }

    h1,
    p {
      margin: 0;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ===== 로그인 카드 (대시보드 .card 스타일 재사용) ===== */
    .login-card {
      width: 380px;
      max-width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* 상단 브랜드 (사이드바 브랜드 톤) */
    .login-card__brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-5);
      background: var(--color-ink);
      color: #fff;
    }

    .login-card__logo {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--color-ink);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
    }

    .login-card__title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .login-card__subtitle {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 2px;
    }

    /* 폼 영역 (설정 페이지 .form 스타일 재사용) */
    .login-card__body {
      padding: var(--space-5);
    }

    .login-card__heading {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: var(--space-1);
    }

    .login-card__desc {
      font-size: 13px;
      color: var(--color-muted);
      margin-bottom: var(--space-5);
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .form__field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form__label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-ink-soft);
    }

    .form__input {
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-2);
      color: var(--color-ink);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form__input:focus {
      border-color: var(--color-ink);
    }

    .btn {
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border-strong);
      background: var(--color-surface-2);
      color: var(--color-ink);
      transition: opacity 0.15s ease;
    }

    .btn--primary {
      background: var(--color-ink);
      color: #fff;
      border-color: var(--color-ink);
      margin-top: var(--space-2);
    }

    .btn--primary:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="login-card__brand">
      <div class="login-card__logo">WC</div>
      <div>
        <div class="login-card__title">WearCare Mate</div>
        <div class="login-card__subtitle">웨어러블 기반 AI 건강 주치의</div>
      </div>
    </div>

    <div class="login-card__body">
      <h1 class="login-card__heading">로그인</h1>
      <p class="login-card__desc">계정 정보를 입력해 대시보드에 접속하세요.</p>

      <form class="form" onsubmit="goToDashboard(event)">
        <div class="form__field">
          <label class="form__label" for="userId">아이디</label>
          <input class="form__input" type="text" id="userId" name="userId"
            placeholder="아이디를 입력하세요" autocomplete="username" />
        </div>

        <div class="form__field">
          <label class="form__label" for="password">비밀번호</label>
          <input class="form__input" type="password" id="password" name="password"
            placeholder="비밀번호를 입력하세요" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn--primary">로그인</button>
      </form>
    </div>
  </div>

  <script>
    // 실제 인증 로직 없이 대시보드(React 앱 루트)로 이동만 처리
    function goToDashboard(event) {
      event.preventDefault();
      window.location.href = "/";
    }
  </script>
</body>

</html>
